<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio debug sign-in</title>
<style>:root{color-scheme:dark;font:17px/1.5 system-ui;background:#17191d;color:#eee}main{max-width:360px;margin:12vh auto;padding:24px}label,input,button{display:block;box-sizing:border-box;width:100%}input,button{font:inherit;padding:12px;margin:12px 0;border-radius:5px;border:1px solid #697587}button{cursor:pointer}p{color:#ffb9b9}</style>
</head><body><main><h1>Radio debug</h1><form method="post" action="/debug/login"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button type="submit">Sign in</button></form>{% if error %}<p role="alert">{{ error }}</p>{% endif %}</main></body></html>
